<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX ULTIMA v13.0 - Clinical Engine</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg: #020617; --card: rgba(15, 23, 42, 0.9); --border: rgba(255, 255, 255, 0.08); }
        body { background-color: var(--bg); color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border); }
        .prompt-preview { background: #000; border: 1px inset rgba(255,255,255,0.1); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const AI_CARDS = {
            gemini: { name: "Gemini 1.5 Pro", icon: "fa-gem", color: "text-blue-400" },
            notebook: { name: "NotebookLM", icon: "fa-book", color: "text-emerald-400" },
            mistral: { name: "Mistral Large", icon: "fa-wind", color: "text-orange-400" }
        };

        const DATA = {
            gourmand: {
                title: "Dr GOURMAND",
                subtitle: "Moteur de Simulation Clinique Hardcore",
                prompts: [
                    {
                        id: "g_master",
                        title: "Initialisation du Moteur (System Prompt)",
                        desc: "Configuration du Game Master. À copier dans Gemini 1.5 Pro avant de commencer.",
                        ai: "gemini",
                        inputs: [
                            {key: "spe", label: "Spécialité", placeholder: "Médecine Interne / Réanimation"},
                            {key: "lvl", label: "Niveau de Chaos (1-10)", placeholder: "9"}
                        ],
                        workflow: "1. Copier ce prompt. 2. Attendre l'arrivée du patient. 3. Ne jamais demander d'aide à l'IA.",
                        template: (v) => `[SYSTEM PROMPT - DO NOT DEVIATE]
Tu es le Moteur de Simulation 'Dr GOURMAND'. Ton but est de tester mes capacités de diagnostic et de gestion de crise en ${v.spe || 'Médecine Interne'}.

RÈGLES DU MOTEUR :
1. ÉTAT CACHÉ (HIDDEN STATE) : Détermine secrètement un dossier patient complet (Âge, Sexe, ATCD, Pathologie réelle, Constantes de base). Ne révèle JAMAIS le diagnostic, même si je commets une erreur fatale.
2. VARIABLES DYNAMIQUES : Gère en interne :
   - Stabilité (0-100). Si < 20 = arrêt cardiorespiratoire.
   - Temps (Chaque tour = +15min à +4h selon l'examen).
3. RÉPONSES BRUTES : Tu ne donnes AUCUN conseil. Si je demande un examen, tu donnes le résultat brut (ex: 'Gazométrie : pH 7.21, pCO2 55...'). Si je demande l'examen clinique, décris ce que je vois/entends.
4. CONSÉQUENCES : Si je prescris un traitement inadapté, aggrave l'état du patient de façon réaliste.
5. DÉBRIEFING : Uniquement après le décès ou la résolution complète, fournis une analyse critique du raisonnement (Biais d'ancrage, examens inutiles, retard de prise en charge).

Initialise maintenant le cas : Le patient arrive. Décris le motif d'admission et les constantes vitales immédiates.`
                    },
                    {
                        id: "g_action",
                        title: "Exécution de Prescription",
                        desc: "Prompt pour valider une thérapeutique lourde.",
                        ai: "gemini",
                        inputs: [
                            {key: "tt", label: "Thérapeutique", placeholder: "ex: Bolus Solumedrol 1g ou ATB probabiliste"}
                        ],
                        template: (v) => `[ACTION CLINIQUE] : J'administre immédiatement ${v.tt || 'le traitement'}. 
Simule l'interaction avec l'état caché du patient :
- Si correct : Stabilisation progressive des constantes.
- Si incorrect : Choc anaphylactique, aggravation de l'acidose ou complication spécifique.
Donne-moi le bilan clinique à T+30min et T+2h.`
                    }
                ]
            },
            medecine: {
                title: "Médecine Interne",
                subtitle: "Raisonnement & Evidence-Based",
                prompts: [
                    {
                        id: "m_ebm",
                        title: "Le Critique EBM (NotebookLM)",
                        desc: "Force NotebookLM à sortir du simple résumé pour entrer dans l'analyse de preuve.",
                        ai: "notebook",
                        inputs: [
                            {key: "sujet", label: "Pathologie", placeholder: "ex: Syndrome de Gougerot-Sjögren"}
                        ],
                        workflow: "Chargez vos PDF Zotero, puis lancez ce prompt pour confronter les sources.",
                        template: (v) => `À partir des documents fournis sur ${v.sujet || 'cette pathologie'}, réalise une analyse critique de niveau Expert :
1. NIVEAU DE PREUVE : Identifie les recommandations de Grade A vs les simples avis d'experts.
2. CONFLITS DE DONNÉES : Cite explicitement deux points où les sources chargées ne sont pas d'accord.
3. ABSENCE DE DONNÉES : Identifie ce que ces documents ne disent pas (les zones d'ombre du traitement).
4. SYNTHÈSE CLINIQUE : Construis un arbre décisionnel basé UNIQUEMENT sur ces sources.`
                    },
                    {
                        id: "m_red",
                        title: "L'Avocat du Diable (Mistral)",
                        desc: "Utilise Mistral pour déconstruire votre propre biais d'ancrage.",
                        ai: "mistral",
                        inputs: [
                            {key: "hyp", label: "Votre Hypothèse", placeholder: "ex: Maladie de Horton"},
                            {key: "dossier", label: "Points clés du dossier", placeholder: "ex: Céphalées, VS à 80, pas de fièvre"}
                        ],
                        template: (v) => `Je suspecte ${v.hyp || 'ce diagnostic'} chez ce patient. Voici les éléments : ${v.dossier || '...'}
Agis comme un Consultant Senior sceptique. Ton rôle est de détruire mon hypothèse :
1. BIAIS : Identifie quel biais cognitif me pousse vers ce diagnostic (Ancrage ? Disponibilité ?).
2. MIMICS : Liste 3 diagnostics 'tueurs' qui présentent exactement ces signes mais qui ne sont pas ma suspicion.
3. INCOHÉRENCES : Relève dans mon dossier ce qui ne colle PAS avec ma suspicion.`
                    }
                ]
            }
        };

        /* --- COMPOSANTS UI --- */

        const PromptCard = ({ item }) => {
            const [inputs, setInputs] = useState({});
            const [copied, setCopied] = useState(false);
            const ai = AI_CARDS[item.ai];

            const finalPrompt = useMemo(() => item.template(inputs), [inputs, item]);

            return (
                <div className="glass rounded-xl p-6 flex flex-col gap-4 animate-fade border-l-4 border-blue-500 hover:shadow-2xl hover:shadow-blue-500/10 transition-all">
                    <div className="flex justify-between items-start">
                        <div>
                            <h3 className="text-xl font-bold font-display">{item.title}</h3>
                            <div className="flex items-center gap-2 mt-1">
                                <i className={`fa-solid ${ai.icon} ${ai.color}`}></i>
                                <span className="text-xs font-mono uppercase text-slate-400">Cible : {ai.name}</span>
                            </div>
                        </div>
                        <button 
                            onClick={() => { navigator.clipboard.writeText(finalPrompt); setCopied(true); setTimeout(() => setCopied(false), 2000); }}
                            className={`px-4 py-2 rounded font-bold text-xs uppercase transition-all ${copied ? 'bg-green-600' : 'bg-blue-600 hover:bg-blue-500'}`}
                        >
                            {copied ? 'Copié !' : 'Copier'}
                        </button>
                    </div>

                    <p className="text-sm text-slate-400 italic">"{item.desc}"</p>

                    {item.workflow && (
                        <div className="text-[10px] bg-white/5 p-2 rounded border border-white/5">
                            <span className="font-bold text-blue-400 uppercase">Workflow :</span> {item.workflow}
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {item.inputs.map(inp => (
                            <div key={inp.key} className="flex flex-col gap-1">
                                <label className="text-[10px] uppercase font-bold text-slate-500">{inp.label}</label>
                                <input 
                                    className="bg-slate-900 border border-white/10 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                                    placeholder={inp.placeholder}
                                    onChange={(e) => setInputs({...inputs, [inp.key]: e.target.value})}
                                />
                            </div>
                        ))}
                    </div>

                    <div className="relative group">
                        <div className="absolute -top-2 left-2 px-2 bg-slate-900 text-[9px] font-bold text-slate-500 border border-white/10 rounded">PREVIEW</div>
                        <pre className="prompt-preview p-4 text-xs font-mono text-slate-300 whitespace-pre-wrap max-h-60 overflow-y-auto custom-scrollbar leading-relaxed">
                            {finalPrompt}
                        </pre>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [cat, setCat] = useState('medecine');

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* Sidebar */}
                    <nav className="w-full md:w-64 border-r border-white/10 p-6 flex flex-col gap-8 bg-slate-950/50 backdrop-blur-xl">
                        <div>
                            <h1 className="text-3xl font-black font-display bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">CODEX</h1>
                            <p className="text-[10px] font-mono text-slate-500 mt-2 tracking-widest uppercase">Clinical Architect v13.0</p>
                        </div>
                        
                        <div className="flex flex-col gap-2">
                            {Object.entries(DATA).map(([key, value]) => (
                                <button 
                                    key={key}
                                    onClick={() => setCat(key)}
                                    className={`text-left px-4 py-3 rounded-lg transition-all flex items-center gap-3 ${cat === key ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-slate-400 hover:bg-white/5'}`}
                                >
                                    <i className={`fa-solid ${DATA[key].icon || (key==='gourmand'?'fa-skull-crossbones':'fa-dna')}`}></i>
                                    <span className="font-bold text-sm uppercase tracking-wide">{DATA[key].title}</span>
                                </button>
                            ))}
                        </div>

                        <div className="mt-auto p-4 rounded-lg bg-blue-900/10 border border-blue-500/20">
                            <h4 className="text-[10px] font-bold text-blue-400 uppercase mb-2">Note de l'Architecte</h4>
                            <p className="text-[9px] text-slate-400 leading-relaxed italic">"Le but de la v13 est de forcer l'IA à devenir votre partenaire de raisonnement, pas votre secrétaire."</p>
                        </div>
                    </nav>

                    {/* Main */}
                    <main className="flex-1 p-4 md:p-12 overflow-y-auto custom-scrollbar">
                        <div className="max-w-4xl mx-auto flex flex-col gap-10">
                            <header>
                                <h2 className="text-5xl font-black font-display tracking-tight text-white">{DATA[cat].title}</h2>
                                <p className="text-slate-400 mt-2 font-light text-lg">{DATA[cat].subtitle}</p>
                            </header>

                            <div className="flex flex-col gap-8">
                                {DATA[cat].prompts.map(p => <PromptCard key={p.id} item={p} />)}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
