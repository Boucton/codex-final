<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>CODEX ULTIMA — Interface de Pensée</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- React CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #12172a;
      --accent: #4da6ff;
      --text: #e6ebff;
      --muted: #9aa4c7;
      --danger: #ff6b6b;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #101633, var(--bg));
      color: var(--text);
    }

    header {
      padding: 2.5rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.6rem;
      margin-bottom: .5rem;
      letter-spacing: .05em;
    }

    header p {
      color: var(--muted);
      max-width: 680px;
      margin: auto;
      line-height: 1.6;
    }

    .sablier {
      margin-top: 1.2rem;
      font-size: 1.6rem;
      opacity: .7;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 1.5rem;
    }

    .section {
      margin-bottom: 3rem;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: .7rem;
      font-size: 1.5rem;
      margin-bottom: 1.2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.4rem;
    }

    .card {
      background: linear-gradient(160deg, #151b36, #0e1328);
      border-radius: var(--radius);
      padding: 1.4rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      transition: transform .25s ease, box-shadow .25s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }

    .card i.icon {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: .6rem;
    }

    .card h3 {
      margin: .2rem 0 .5rem 0;
      font-size: 1.15rem;
    }

    .card p {
      font-size: .9rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .workflow {
      margin-top: .8rem;
      font-size: .85rem;
      color: #c9d3ff;
    }

    .badge {
      display: inline-block;
      padding: .25rem .55rem;
      font-size: .7rem;
      border-radius: 6px;
      background: rgba(255,255,255,.08);
      margin-right: .3rem;
    }

    .danger {
      color: var(--danger);
    }

    footer {
      text-align: center;
      padding: 2.5rem 1rem;
      font-size: .8rem;
      color: var(--muted);
    }

    /* Secret */
    .secret {
      opacity: .04;
      user-select: none;
    }
  </style>
</head>
<body>

<header>
  <h1>CODEX ULTIMA</h1>
  <p>
    Interface de pensée augmentée.<br />
    Simulation, décision, cognition — sous contrainte de temps.
  </p>
  <div class="sablier" title="Le temps n'est jamais neutre.">⏳</div>
</header>

<main id="root"></main>

<footer>
  CODEX ULTIMA — Certaines décisions ne se répètent pas.
</footer>

<script type="text/babel">

const SECTIONS = [
  {
    title: 'Simulation & Décision',
    icon: 'fa-dice-d20',
    items: [
      {
        icon: 'fa-user-doctor',
        title: 'Dr GOURMAND — Le Jeu',
        desc: 'Simulation clinique narrative. Chaque décision modifie l’état du patient, du temps et de vous-même.',
        workflow: [
          'Présentation du cas',
          'Contrainte cachée',
          'Décision sous pression',
          'Feedback cognitif'
        ],
        tags: ['jeu', 'médecine', 'raisonnement']
      }
    ]
  },
  {
    title: 'Médecine & Clinique',
    icon: 'fa-stethoscope',
    items: [
      {
        icon: 'fa-brain',
        title: 'Red Team Diagnostique',
        desc: 'Attaque systématique de ton raisonnement clinique pour réduire les biais cognitifs.',
        workflow: ['Formulation du cas', 'Injection de biais', 'Contre-argumentation', 'Synthèse sécurisée'],
        tags: ['diagnostic', 'biais', 'sécurité']
      }
    ]
  },
  {
    title: 'Raisonnement & Cognition',
    icon: 'fa-lightbulb',
    items: [
      {
        icon: 'fa-chess',
        title: 'Pensée sous contrainte',
        desc: 'Forcer une décision optimale malgré des ressources cognitives limitées.',
        workflow: ['Objectif imposé', 'Contrainte aléatoire', 'Décision', 'Analyse'],
        tags: ['cognition', 'stratégie']
      }
    ]
  },
  {
    title: 'Exploration',
    icon: 'fa-meteor',
    items: [
      {
        icon: 'fa-clock',
        title: 'Le Temps',
        desc: 'Certains savoirs n’apparaissent qu’à ceux qui osent ralentir.',
        workflow: ['Observation', 'Attente', 'Révélation'],
        tags: ['secret'],
        secret: true
      }
    ]
  }
];

function App() {
  return (
    <>
      {SECTIONS.map((sec, idx) => (
        <section key={idx} className="section">
          <div className="section-title">
            <i className={`fa-solid ${sec.icon}`}></i>
            <span>{sec.title}</span>
          </div>

          <div className="grid">
            {sec.items.map((item, i) => (
              <div key={i} className={`card ${item.secret ? 'secret' : ''}`}>
                <i className={`fa-solid ${item.icon} icon`}></i>
                <h3>{item.title}</h3>
                <p>{item.desc}</p>
                <div className="workflow">
                  {item.workflow.map((w, j) => (
                    <div key={j}>▸ {w}</div>
                  ))}
                </div>
                <div style={{marginTop: '.6rem'}}>
                  {item.tags.map((t, k) => (
                    <span key={k} className="badge">{t}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </section>
      ))}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>
</html>
