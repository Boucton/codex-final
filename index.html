<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX ULTIMA v8.0 - Cognitive Hub</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #030712;
            --glass-panel: rgba(17, 24, 39, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        body {
            background-color: var(--bg-deep);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at 50% 30%, black 20%, transparent 100%);
        }
        .glass {
            background: var(--glass-panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        /* --- CONFIGURATION & THEMES --- */
        const THEME_CONFIG = {
            medecine: {
                accent: "text-sky-400",
                bgAccent: "bg-sky-500",
                borderAccent: "border-sky-500",
                badge: "bg-sky-500/10 text-sky-300 border-sky-500/20",
                button: "bg-slate-800 hover:bg-sky-600 border-white/10 hover:border-sky-400 text-white",
                activeNav: "bg-sky-500/10 text-sky-300 border-l-2 border-sky-400",
                gradientIcon: "from-sky-500/20 to-blue-600/20 text-sky-400",
            },
            gourmand: {
                accent: "text-rose-400",
                bgAccent: "bg-rose-500",
                borderAccent: "border-rose-500",
                badge: "bg-rose-500/10 text-rose-300 border-rose-500/20",
                button: "bg-slate-800 hover:bg-rose-600 border-white/10 hover:border-rose-400 text-white",
                activeNav: "bg-rose-500/10 text-rose-300 border-l-2 border-rose-400",
                gradientIcon: "from-rose-500/20 to-red-600/20 text-rose-400",
            },
            culture: {
                accent: "text-purple-400",
                bgAccent: "bg-purple-500",
                borderAccent: "border-purple-500",
                badge: "bg-purple-500/10 text-purple-300 border-purple-500/20",
                button: "bg-slate-800 hover:bg-purple-600 border-white/10 hover:border-purple-400 text-white",
                activeNav: "bg-purple-500/10 text-purple-300 border-l-2 border-purple-400",
                gradientIcon: "from-purple-500/20 to-indigo-600/20 text-purple-400",
            },
            code: {
                accent: "text-orange-400",
                bgAccent: "bg-orange-500",
                borderAccent: "border-orange-500",
                badge: "bg-orange-500/10 text-orange-300 border-orange-500/20",
                button: "bg-slate-800 hover:bg-orange-600 border-white/10 hover:border-orange-400 text-white",
                activeNav: "bg-orange-500/10 text-orange-300 border-l-2 border-orange-400",
                gradientIcon: "from-orange-500/20 to-amber-600/20 text-orange-400",
            }
        };

        const AI_TOOLS = {
            gemini: { label: "Gemini Pro", icon: "fa-gem", color: "text-blue-300" },
            notebook: { label: "NotebookLM", icon: "fa-book-journal-whills", color: "text-emerald-300" },
            mistral: { label: "Mistral", icon: "fa-wind", color: "text-indigo-300" },
            python: { label: "Python", icon: "fa-python", color: "text-yellow-300" }
        };

        /* --- DATA LAYER (Avec Variantes & Icônes) --- */
        const DATA = {
            medecine: {
                title: "Médecine Interne",
                icon: "fa-user-doctor",
                img: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=2000&q=80",
                prompts: [
                    {
                        id: "m1",
                        title: "Synthèse Bibliographique",
                        itemIcon: "fa-book-medical",
                        desc: "Analyse croisée de littérature pour staff ou recherche.",
                        aiTags: ["notebook", "gemini"],
                        workflow: ["Export Zotero (PDF)", "Upload NotebookLM", "Lancer Prompt"],
                        inputs: [
                            {key: "sujet", label: "Sujet", placeholder: "ex: Vascularites ANCA"},
                            {key: "nb", label: "Nb Sources", placeholder: "5"}
                        ],
                        templates: {
                            standard: (v) => `Agis comme un Professeur de Médecine Interne. J'ai chargé ${v.nb || 'des'} articles sur ${v.sujet || 'le sujet'} dans NotebookLM.\n\nTACHE : Synthèse structurée focalisée sur :\n1. Nouvelles cibles thérapeutiques.\n2. Controverses actuelles.\n3. Biais méthodologiques.\n\nSORTIE : Tableau comparatif + Conclusion "Take Home Message".`,
                            short: (v) => `Résume les points clés de ces articles sur ${v.sujet} en 3 bullet points pour un brief rapide.`,
                            hardcore: (v) => `Analyse critique impitoyable des articles sur ${v.sujet}. Cherche chaque biais statistique, chaque conflit d'intérêt et chaque faiblesse de p-value. Ne laisse rien passer.`
                        }
                    },
                    {
                        id: "m2",
                        title: "Physiopathologie Moléculaire",
                        itemIcon: "fa-dna",
                        desc: "Visualisation des cascades inflammatoires.",
                        aiTags: ["gemini"],
                        inputs: [{key: "patho", label: "Pathologie", placeholder: "ex: SAM"}],
                        templates: {
                            standard: (v) => `Explique la physiopathologie de ${v.patho} au niveau cellulaire/moléculaire.\n1. Cascade inflammatoire étape par étape.\n2. Analogies visuelles.\n3. Liens cliniques directs.\n4. Cibles des biothérapies.`,
                            teaching: (v) => `Explique ${v.patho} à un externe en médecine. Utilise des métaphores simples (champ de bataille, usine) pour expliquer les cytokines.`
                        }
                    },
                    {
                        id: "m3",
                        title: "Red Team Diagnostic",
                        itemIcon: "fa-chess-knight",
                        desc: "Lutte contre le biais de confirmation.",
                        aiTags: ["gemini", "mistral"],
                        inputs: [
                            {key: "diag", label: "Mon hypothèse", placeholder: "Horton"},
                            {key: "signes", label: "Signes", placeholder: "Céphalées..."}
                        ],
                        templates: {
                            standard: (v) => `Je suspecte ${v.diag} devant : ${v.signes}. Prouve que j'ai tort.\n1. Liste 3 diagnostics différentiels (Mimics) plus graves.\n2. Donne le "Key Feature" manquant pour chacun.\n3. Estime la probabilité pré-test.`
                        }
                    }
                ]
            },
            gourmand: {
                title: "Dr GOURMAND (Jeu)",
                icon: "fa-skull-crossbones",
                // Image corrigée (ambiance sombre urgences)
                img: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=2000&q=80",
                prompts: [
                    {
                        id: "g1",
                        title: "Moteur de Jeu v2",
                        itemIcon: "fa-gamepad",
                        desc: "Lancement de la simulation clinique hardcore.",
                        aiTags: ["gemini"],
                        workflow: ["Nouveau Chat", "Copier Prompt", "Aucun indice"],
                        inputs: [
                            {key: "spe", label: "Spécialité", placeholder: "Infectieux"},
                            {key: "diff", label: "Niveau (1-10)", placeholder: "9"}
                        ],
                        templates: {
                            standard: (v) => `Tu es le Moteur "Dr GOURMAND".\nPARAM: Spécialité ${v.spe}, Niveau ${v.diff}.\n\nRÈGLES:\n1. Choisis SECRÈTEMENT patient + diagnostic.\n2. Tour par tour. Tu donnes juste le résultat.\n3. Gère le TEMPS (Heures).\n4. Si je traîne -> le patient meurt.\n\nCommence par l'arrivée aux urgences.`,
                            hardcore: (v) => `Mode CAUCHEMAR Dr GOURMAND. Spécialité ${v.spe}. Le patient est instable d'emblée. La moindre erreur thérapeutique est fatale. Sois cryptique dans la séméiologie.`
                        }
                    },
                    {
                        id: "g2",
                        title: "Coup de Poker",
                        itemIcon: "fa-syringe",
                        desc: "Traitement d'épreuve risqué.",
                        aiTags: ["gemini"],
                        inputs: [{key: "tt", label: "Traitement", placeholder: "Solumedrol 1g"}],
                        templates: {
                            standard: (v) => `ACTION JEU: J'administre ${v.tt}. Simule les effets sur 6h. Si diagnostic faux -> complications.`
                        }
                    }
                ]
            },
            culture: {
                title: "Culture & Savoir",
                icon: "fa-landmark",
                img: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=2000&q=80",
                prompts: [
                    {
                        id: "c1",
                        title: "Débat Philosophique",
                        itemIcon: "fa-comments",
                        desc: "Simulation de conversation entre grands esprits.",
                        aiTags: ["mistral"],
                        inputs: [
                            {key: "guests", label: "Invités", placeholder: "Camus, Nietzsche"},
                            {key: "topic", label: "Sujet", placeholder: "L'Absurde"}
                        ],
                        templates: {
                            standard: (v) => `Script théâtral entre ${v.guests} sur : ${v.topic}.\nRespecte le style, le vocabulaire et les concepts de chacun. Ils doivent être en désaccord.`
                        }
                    },
                    {
                        id: "c2",
                        title: "Quiz Adaptatif",
                        itemIcon: "fa-brain",
                        desc: "Apprentissage par l'erreur.",
                        aiTags: ["gemini"],
                        inputs: [{key: "th", label: "Thème", placeholder: "Histoire"}],
                        templates: {
                            standard: (v) => `Quiz 5 questions sur ${v.th}. Niveau Difficile. Une par une. Si juste -> plus dur. Si faux -> explication + anecdote.`
                        }
                    }
                ]
            },
            code: {
                title: "Code & Tech",
                icon: "fa-terminal",
                img: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=2000&q=80",
                prompts: [
                    {
                        id: "dev1",
                        title: "Architecte Web",
                        itemIcon: "fa-laptop-code",
                        desc: "Génération d'apps one-file.",
                        aiTags: ["gemini", "python"],
                        inputs: [{key: "app", label: "Idée", placeholder: "Calculateur"}],
                        templates: {
                            standard: (v) => `Expert React/Tailwind. Crée une Single File App pour : ${v.app}. Design sombre, pro. Code complet sans explication.`
                        }
                    }
                ]
            }
        };

        /* --- HOOKS --- */
        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.log(error); }
            };
            return [storedValue, setValue];
        };

        /* --- COMPONENTS --- */

        const Sidebar = ({ active, setActive, view, setView }) => {
            return (
                <div className="w-full md:w-20 lg:w-72 glass flex md:flex-col border-r border-white/10 z-50 md:h-screen fixed md:relative bottom-0">
                    <div className="p-6 hidden md:flex flex-col items-center lg:items-start cursor-pointer" onClick={() => setView('home')}>
                        <h1 className="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-slate-100 to-slate-400 hidden lg:block tracking-tight">
                            CODEX
                        </h1>
                        <div className="flex items-center gap-2 mt-1 hidden lg:flex">
                            <span className="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-white/5 font-mono">v8.0</span>
                            <span className="text-[10px] text-emerald-400 font-mono">ON-LINE</span>
                        </div>
                        <i className="fa-solid fa-cube text-3xl text-slate-500 lg:hidden"></i>
                    </div>
                    
                    <nav className="flex-1 flex md:flex-col gap-2 p-2 overflow-x-auto md:overflow-visible no-scrollbar">
                        <button 
                            onClick={() => setView('favorites')}
                            className={`p-3 rounded-xl flex items-center gap-4 transition-all duration-300 group
                            ${view === 'favorites' ? 'bg-yellow-500/10 text-yellow-300 border border-yellow-500/20' : 'text-slate-500 hover:text-white hover:bg-white/5'}`}
                        >
                            <div className="w-8 h-8 rounded-lg flex items-center justify-center bg-yellow-500/20 group-hover:scale-110 transition-transform">
                                <i className="fa-solid fa-star"></i>
                            </div>
                            <span className="font-medium hidden lg:block text-sm">Favoris</span>
                        </button>

                        <div className="h-px bg-white/5 my-2 hidden md:block"></div>

                        {Object.entries(DATA).map(([key, cat]) => {
                            const styles = THEME_CONFIG[key];
                            const isActive = active === key && view === 'home';
                            return (
                                <button
                                    key={key}
                                    onClick={() => { setActive(key); setView('home'); }}
                                    className={`p-3 rounded-xl flex items-center gap-4 transition-all duration-300 group
                                    ${isActive ? styles.activeNav : 'text-slate-500 hover:text-slate-200 hover:bg-white/5'}`}
                                >
                                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center bg-gradient-to-br ${styles.gradientIcon} group-hover:scale-110 transition-transform shadow-lg`}>
                                        <i className={`fa-solid ${cat.icon}`}></i>
                                    </div>
                                    <span className="font-medium hidden lg:block text-sm">{cat.title.split(' ')[0]}...</span>
                                </button>
                            );
                        })}
                    </nav>
                </div>
            );
        };

        const PromptCard = ({ item, themeKey, isFav, toggleFav }) => {
            const [inputs, setInputs] = useState({});
            const [copied, setCopied] = useState(false);
            const [variant, setVariant] = useState('standard');
            
            const styles = THEME_CONFIG[themeKey] || THEME_CONFIG['medecine']; // Fallback

            const handleInput = (key, value) => setInputs(prev => ({...prev, [key]: value}));

            const finalPrompt = useMemo(() => {
                const tmpl = item.templates[variant] || item.templates['standard'];
                return tmpl(inputs);
            }, [inputs, variant, item]);

            const copy = () => {
                navigator.clipboard.writeText(finalPrompt);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="glass rounded-2xl p-6 border-t border-white/5 hover:border-white/20 transition-all duration-300 group animate-fade flex flex-col h-full">
                    {/* Header */}
                    <div className="flex justify-between items-start mb-4">
                        <div className="flex items-start gap-3">
                            <div className={`w-10 h-10 rounded-lg flex items-center justify-center bg-slate-900 border border-white/5 text-lg ${styles.accent}`}>
                                <i className={`fa-solid ${item.itemIcon || 'fa-bolt'}`}></i>
                            </div>
                            <div>
                                <h3 className="text-xl font-bold text-slate-100 leading-tight">{item.title}</h3>
                                <div className="flex flex-wrap gap-2 mt-2">
                                    {item.aiTags && item.aiTags.map(tag => (
                                        <span key={tag} className="flex items-center gap-1 px-2 py-0.5 rounded text-[10px] bg-slate-950 border border-white/10 text-slate-400">
                                            <i className={`fa-solid ${AI_TOOLS[tag].icon} ${AI_TOOLS[tag].color}`}></i>
                                            {AI_TOOLS[tag].label}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        </div>
                        <button onClick={toggleFav} className={`text-lg transition-transform hover:scale-110 ${isFav ? 'text-yellow-400' : 'text-slate-700 hover:text-slate-400'}`}>
                            <i className={`fa-${isFav ? 'solid' : 'regular'} fa-star`}></i>
                        </button>
                    </div>

                    <p className="text-sm text-slate-400 mb-6 leading-relaxed flex-1">{item.desc}</p>

                    {/* Variant Selector */}
                    {Object.keys(item.templates).length > 1 && (
                        <div className="flex gap-1 bg-slate-950/50 p-1 rounded-lg mb-4 border border-white/5">
                            {Object.keys(item.templates).map(v => (
                                <button
                                    key={v}
                                    onClick={() => setVariant(v)}
                                    className={`flex-1 py-1.5 text-[10px] uppercase font-bold tracking-wide rounded transition-colors
                                    ${variant === v ? 'bg-slate-800 text-white shadow' : 'text-slate-500 hover:text-slate-300'}`}
                                >
                                    {v}
                                </button>
                            ))}
                        </div>
                    )}

                    {/* Inputs */}
                    {item.inputs && item.inputs.length > 0 && (
                        <div className="space-y-3 mb-4">
                            {item.inputs.map((inp) => (
                                <div key={inp.key}>
                                    <input 
                                        type="text" 
                                        placeholder={inp.label + "..."}
                                        onChange={(e) => handleInput(inp.key, e.target.value)}
                                        className="w-full bg-slate-900/50 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-slate-500 transition-colors placeholder-slate-600"
                                    />
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Output Preview */}
                    <div className="relative group/code mt-auto">
                        <pre className="bg-slate-950 rounded-xl p-4 text-xs text-slate-400 font-mono whitespace-pre-wrap border border-white/5 max-h-40 overflow-y-auto custom-scrollbar">
                            {finalPrompt}
                        </pre>
                        <button 
                            onClick={copy}
                            className={`absolute bottom-2 right-2 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all shadow-lg flex items-center gap-2 ${copied ? 'bg-emerald-600 text-white' : styles.button}`}
                        >
                            <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                            {copied ? 'Copié' : 'Copier'}
                        </button>
                    </div>

                    {/* Workflow Mini */}
                    {item.workflow && (
                        <div className="mt-4 pt-4 border-t border-white/5">
                            <div className="flex flex-wrap gap-2 text-[10px] text-slate-500">
                                {item.workflow.map((step, i) => (
                                    <span key={i} className="flex items-center gap-1 bg-slate-900 px-2 py-1 rounded">
                                        <span className="w-4 h-4 rounded-full bg-slate-800 flex items-center justify-center text-[9px]">{i+1}</span>
                                        {step}
                                    </span>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MainContent = ({ active, view, favorites, toggleFav }) => {
            const [search, setSearch] = useState("");
            
            // Logique de filtrage (Recherche + Vue)
            const allPrompts = useMemo(() => {
                let items = [];
                Object.entries(DATA).forEach(([catKey, cat]) => {
                    cat.prompts.forEach(p => items.push({...p, catKey, catTitle: cat.title}));
                });
                return items;
            }, []);

            const displayedPrompts = useMemo(() => {
                let list = view === 'favorites' 
                    ? allPrompts.filter(p => favorites.includes(p.id))
                    : DATA[active].prompts.map(p => ({...p, catKey: active}));

                if (search.trim()) {
                    const q = search.toLowerCase();
                    // Recherche globale si input
                    list = allPrompts.filter(p => 
                        p.title.toLowerCase().includes(q) || 
                        p.desc.toLowerCase().includes(q) ||
                        p.catTitle.toLowerCase().includes(q)
                    );
                }
                return list;
            }, [search, view, active, allPrompts, favorites]);

            const currentData = DATA[active];
            const currentStyle = THEME_CONFIG[active];

            return (
                <div className="flex-1 h-screen overflow-y-auto relative custom-scrollbar bg-slate-950/50">
                    
                    {/* Top Bar (Search) */}
                    <div className="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-white/5 p-4 flex items-center justify-between gap-4">
                        <div className="relative flex-1 max-w-xl">
                            <i className="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input 
                                type="text" 
                                placeholder="Rechercher un prompt, un tag..." 
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                                className="w-full bg-slate-900 border border-white/10 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-slate-600 transition-colors placeholder-slate-600"
                            />
                        </div>
                        <div className="flex items-center gap-3 text-xs text-slate-500 font-mono hidden sm:flex">
                            <span><i className="fa-solid fa-database mr-1"></i>LOCAL</span>
                            <span><i className="fa-solid fa-bolt mr-1"></i>FAST</span>
                        </div>
                    </div>

                    <div className="p-4 md:p-8 max-w-7xl mx-auto">
                        
                        {/* Header Section (Uniquement si pas de recherche et vue Home) */}
                        {!search && view === 'home' && (
                            <div className="relative h-48 md:h-64 rounded-3xl overflow-hidden mb-10 border border-white/5 shadow-2xl group animate-fade">
                                <img src={currentData.img} className="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:scale-105 transition-transform duration-[2s]" 
                                    onError={(e) => {e.target.onerror = null; e.target.style.display='none'; e.target.parentNode.style.background = '#1e293b'}} />
                                <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/50 to-transparent"></div>
                                <div className="absolute bottom-0 left-0 p-6 md:p-8 w-full">
                                    <h2 className="text-3xl md:text-5xl font-black text-white mb-2 tracking-tight drop-shadow-xl">{currentData.title}</h2>
                                    <div className="flex items-center gap-3">
                                        <span className={`h-1.5 w-12 rounded-full ${currentStyle.bgAccent}`}></span>
                                        <p className={`text-sm md:text-lg font-medium ${currentStyle.accent}`}>Bibliothèque Cognitive</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Résultats de Recherche / Vue Favoris */}
                        {(search || view === 'favorites') && (
                            <div className="mb-8 flex items-center gap-2">
                                <span className="text-xl font-bold text-white">
                                    {search ? `Recherche : "${search}"` : "Vos Favoris"}
                                </span>
                                <span className="px-2 py-0.5 rounded-full bg-slate-800 text-xs text-slate-400 border border-white/10">
                                    {displayedPrompts.length}
                                </span>
                            </div>
                        )}

                        {/* Grille */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-2 gap-6 pb-20">
                            {displayedPrompts.length > 0 ? (
                                displayedPrompts.map(p => (
                                    <PromptCard 
                                        key={p.id} 
                                        item={p} 
                                        themeKey={p.catKey} 
                                        isFav={favorites.includes(p.id)}
                                        toggleFav={() => toggleFav(p.id)}
                                    />
                                ))
                            ) : (
                                <div className="col-span-full py-20 text-center text-slate-600">
                                    <i className="fa-solid fa-ghost text-4xl mb-4 opacity-50"></i>
                                    <p>Aucun prompt trouvé.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('medecine');
            const [view, setView] = useState('home'); // 'home' | 'favorites'
            const [favorites, setFavorites] = useLocalStorage('codex_favs', []);

            const toggleFav = (id) => {
                if (favorites.includes(id)) {
                    setFavorites(favorites.filter(favId => favId !== id));
                } else {
                    setFavorites([...favorites, id]);
                }
            };

            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden text-slate-200">
                    <Sidebar active={activeTab} setActive={setActiveTab} view={view} setView={setView} />
                    <MainContent active={activeTab} view={view} favorites={favorites} toggleFav={toggleFav} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
