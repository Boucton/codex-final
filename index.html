<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root { --bg-deep: #020617; --glass-panel: rgba(15, 23, 42, 0.92); --glass-border: rgba(255, 255, 255, 0.08); }
        body { background-color: var(--bg-deep); color: #e2e8f0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .grid-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 30px 30px; mask-image: radial-gradient(circle at 50% 30%, black 40%, transparent 100%); }
        .glass { background: var(--glass-panel); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-mystic { font-family: 'Cinzel', serif; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Animation Sablier */
        .rotate-cw { transform: rotate(180deg); transition: transform 0.5s ease-in-out; }
        .rotate-ccw { transform: rotate(0deg); transition: transform 0.5s ease-in-out; }
        .golden-glow { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); border-color: rgba(251, 191, 36, 0.8); }
    </style>
</head>
<body>

    <script type="text/babel">

            gourmand: {
                accent: "text-rose-400", bgAccent: "bg-rose-500", borderAccent: "border-rose-500", badge: "bg-rose-950 text-rose-300 border-rose-800", button: "bg-slate-800 hover:bg-rose-600 text-white border-white/10", gradientIcon: "from-rose-900 to-red-900 text-rose-300"
            },
            cosmos: { // NOUVEAU
                accent: "text-indigo-400", bgAccent: "bg-indigo-500", borderAccent: "border-indigo-500", badge: "bg-indigo-950 text-indigo-300 border-indigo-800", button: "bg-slate-800 hover:bg-indigo-600 text-white border-white/10", gradientIcon: "from-indigo-900 to-violet-900 text-indigo-300"

            },
            strategy: { // NOUVEAU
                accent: "text-emerald-400", bgAccent: "bg-emerald-500", borderAccent: "border-emerald-500", badge: "bg-emerald-950 text-emerald-300 border-emerald-800", button: "bg-slate-800 hover:bg-emerald-600 text-white border-white/10", gradientIcon: "from-emerald-900 to-teal-900 text-emerald-300"
            },
            time: { // MYSTÈRE
                accent: "text-amber-400", bgAccent: "bg-amber-500", borderAccent: "border-amber-500", badge: "bg-amber-950 text-amber-300 border-amber-800", button: "bg-slate-900 hover:bg-amber-600 text-amber-100 border-amber-500/30", gradientIcon: "from-amber-900 to-yellow-900 text-amber-300"

        };

        const val = (inputs, key, placeholder) => {
            const value = inputs[key];
            return (value && value.trim() !== "") ? value : `[${placeholder.toUpperCase()}]`;
        };

        /* --- DATA LAYER --- */
        const DATA = {
            medecine: {
                title: "Médecine Interne",
                icon: "fa-user-doctor",
                // Image réparée : thème laboratoire/microscope
                img: "https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?auto=format&fit=crop&w=2000&q=80",
                prompts: [
                    {

                        desc: "Transformez une pile de PDF en état de l'art clinique structuré.",
                        type: "notebook", aiTags: ["notebook"],
                        workflow: ["Export Zotero (PDF)", "Upload NotebookLM", "Coller Prompt"],
                        inputs: [{key: "sujet", label: "Sujet", placeholder: "ex: Lupus"}, {key: "cible", label: "Public", placeholder: "Staff"}],
                        pedagogy: { mechanism: "RAG Synthesis", bias: "Biais de sélection", tip: "L'IA ne peut pas inventer ce qui n'est pas dans les PDF." },
                        templates: { standard: (v) => `RÔLE: Expert Méthodologiste.\nSOURCE: Documents chargés.\nTÂCHE: Synthèse EBM sur ${val(v,'sujet','SUJET')}.\n\nSTRUCTURE:\n1. Tableau comparatif (n=, design, résultats).\n2. Consensus vs Controverses (Crucial).\n3. Implications cliniques pour ${val(v,'cible','PUBLIC')}.\n4. Citer les sources [x].` }
                    },
                    {
                        id: "m2", title: "Red Team Diagnostic", itemIcon: "fa-chess",
                        desc: "Luttez contre votre biais de confirmation.",
                        aiTags: ["gemini"],
                        inputs: [{key: "hyp", label: "Mon Diagnostic", placeholder: "Horton"}, {key: "sig", label: "Clinique", placeholder: "Céphalées..."}],

                ]

            gourmand: {
                title: "Dr GOURMAND",
                icon: "fa-utensils",
                img: "./dr-gourmand.png", // Image locale
                prompts: [
                    {
                        id: "g1", title: "Moteur de Simulation", itemIcon: "fa-heart-pulse",
                        desc: "Simulation clinique interactive avec gestion du temps.",
                        aiTags: ["gemini"],
                        inputs: [{key: "spe", label: "Spécialité", placeholder: "Infectio"}, {key: "lvl", label: "Niveau", placeholder: "9"}],
                        pedagogy: { mechanism: "Hidden State", bias: "Stress temporel", tip: "L'IA garde le diagnostic secret." },
                        templates: { standard: (v) => `SYSTEM PROMPT:\nTu es 'Dr GOURMAND', moteur de simulation.\nPARAM: ${val(v,'spe','SPÉ')}, Niv ${val(v,'lvl','LVL')}.\n\nRÈGLES:\n1. Choisis SECRÈTEMENT un cas.\n2. Tour par tour. Tu donnes les résultats bruts.\n3. Gère le TEMPS (Avance l'horloge à chaque examen).\n4. Si je traîne -> Décès.\n\nACTION: Lance l'arrivée aux urgences.` }

                ]
            },
            cosmos: {
                title: "Cosmos & Quantique",
                icon: "fa-atom",
                img: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=2000&q=80",
                prompts: [
                    {
                        id: "cos1", title: "Le Debunker Quantique", itemIcon: "fa-radiation",
                        desc: "Distinguer la vraie physique du mysticisme quantique.",
                        aiTags: ["gemini"],
                        inputs: [{key: "concept", label: "Affirmation douteuse", placeholder: "La conscience crée la réalité"}],
                        pedagogy: { mechanism: "Scientific Literacy", bias: "Effet Dunning-Kruger", tip: "Utilise la rigueur mathématique pour contrer le flou artistique." },
                        templates: { standard: (v) => `Agis comme un Physicien Théoricien (PhD).\nAnalyse cette affirmation populaire : "${val(v,'concept','CONCEPT')}".\n\nTÂCHE :\n1. Déconstruis l'erreur d'interprétation (souvent liée à l'observateur en Méca Q).\n2. Explique le vrai phénomène physique sous-jacent (ex: Décohérence).\n3. Utilise une analogie brutale pour montrer l'absurdité de l'extrapolation macroscopique.` }
                    },
                    {
                        id: "cos2", title: "Architecte de Biosphère", itemIcon: "fa-earth-americas",
                        desc: "Simulation d'exobiologie scientifiquement plausible.",
                        aiTags: ["gemini", "python"],
                        inputs: [{key: "star", label: "Type d'Étoile", placeholder: "Naine Rouge"}, {key: "grav", label: "Gravité", placeholder: "2.5G"}],
                        pedagogy: { mechanism: "Systemic Simulation", bias: "Anthropocentrisme", tip: "Force l'IA à sortir des modèles terrestres." },
                        templates: { standard: (v) => `Conçois un écosystème plausible pour une planète orbitant une ${val(v,'star','ÉTOILE')} avec une gravité de ${val(v,'grav','GRAVITÉ')}.\n\nDÉTAILS :\n1. À quoi ressemblent les plantes (photosynthèse infrarouge ?) ?\n2. Quelle est la morphologie des prédateurs (squelette renforcé ?) ?\n3. Décris une chaîne alimentaire complète.\n4. Génère le prompt pour DALL-E afin de visualiser le super-prédateur.` }
                    },
                    {
                        id: "cos3", title: "L'Intuition Mathématique", itemIcon: "fa-square-root-variable",
                        desc: "Comprendre les équations sans les calculer.",
                        aiTags: ["gemini"],
                        inputs: [{key: "eq", label: "Équation/Théorème", placeholder: "Transformée de Fourier"}],
                        templates: { standard: (v) => `Explique l'intuition profonde derrière : ${val(v,'eq','MATHS')}.\nNe fais pas de démonstration.\nUtilise une analogie visuelle, musicale ou mécanique pour me faire 'sentir' ce que l'équation manipule (flux, rotation, accumulation).` }
                    },
                    {
                        id: "cos4", title: "Voyageur Relativiste", itemIcon: "fa-stopwatch",
                        desc: "Expérience de pensée sur la dilatation temporelle.",
                        aiTags: ["gemini"],
                        inputs: [{key: "vitesse", label: "% Vitesse Lumière", placeholder: "99.9%"}],
                        templates: { standard: (v) => `Je voyage à ${val(v,'vitesse','C')} vers Andromède.\nDécris mon expérience subjective :\n1. La vision (Redshift/Blueshift, effet tunnel).\n2. L'écoulement du temps (Facteur de Lorentz) : combien de temps passe pour moi vs sur Terre ?\n3. L'aspect des objets célestes.` }
                    }

            humanities: {
                title: "Humanités & Arts",

                prompts: [
                    {
                        id: "hum1", title: "Le Manga Historique", itemIcon: "fa-scroll",

                        inputs: [{key: "auteur", label: "Poète Cible", placeholder: "Baudelaire"}, {key: "sujet", label: "Sujet Moderne", placeholder: "Le Smartphone"}],
                        templates: { standard: (v) => `Analyse le style de ${val(v,'auteur','POÈTE')} (rythme, champs lexicaux, spleen).\nEnsuite, écris un poème de 3 strophes sur : ${val(v,'sujet','SUJET')} en imitant parfaitement ce style.\nTermine par une auto-critique : où l'imitation est-elle imparfaite ?` }
                    },
                    {
                        id: "hum3", title: "Director's Cut", itemIcon: "fa-clapperboard",
                        desc: "Analyse filmique et réécriture.",
                        aiTags: ["gemini"],
                        inputs: [{key: "film", label: "Film/Livre", placeholder: "Dune"}, {key: "change", label: "Changement", placeholder: "C'est une comédie musicale"}],
                        templates: { standard: (v) => `Imagine une version alternative de ${val(v,'film','OEUVRE')} où ${val(v,'change','TWIST')}.\nRéécris la scène d'ouverture.\nDécris les choix de caméra, la musique et l'ambiance. Comment cela change-t-il le message profond de l'œuvre ?` }
                    },
                    {
                        id: "hum4", title: "Timelapse Géopolitique", itemIcon: "fa-map-location-dot",
                        desc: "Comprendre les frontières par le temps.",
                        aiTags: ["gemini"],
                        inputs: [{key: "zone", label: "Région", placeholder: "Les Balkans"}],
                        templates: { standard: (v) => `Trace l'évolution de la région ${val(v,'zone','ZONE')} sur les 500 dernières années.\nIdentifie 5 'Points de Bascule' (traités, guerres).\nPour chaque point, explique quelle ethnie ou religion s'est sentie lésée. Explique les tensions actuelles par ces cicatrices passées.` }
                    }
                ]
            },
            strategy: {
                title: "Stratégie & Maîtrise",
                icon: "fa-chess-knight",
                img: "https://images.unsplash.com/photo-1529699211952-734e80c4d42b?auto=format&fit=crop&w=2000&q=80",
                prompts: [
                    {
                        id: "strat1", title: "Ouverture Sensei", itemIcon: "fa-chess-board",
                        desc: "Apprendre les échecs pas à pas.",
                        aiTags: ["gemini"],
                        inputs: [{key: "open", label: "Ouverture", placeholder: "Défense Sicilienne"}],
                        pedagogy: { mechanism: "Chunking", bias: "Surcharge cognitive", tip: "Apprendre les 'idées' plutôt que les coups par cœur." },
                        templates: { standard: (v) => `Enseigne-moi l'ouverture ${val(v,'open','OUVERTURE')}.\nNe me donne pas une liste de coups.\nExplique les IDÉES stratégiques :\n1. Quelle pièce est la vedette ?\n2. Quel est le plan à long terme ?\n3. Quel est le piège classique à éviter ?\n4. Propose un petit puzzle tactique typique de cette position.` }
                    },
                    {
                        id: "strat2", title: "Immersion Polyglotte", itemIcon: "fa-language",
                        desc: "Roleplay linguistique intensif.",
                        aiTags: ["gemini", "audio"],
                        inputs: [{key: "langue", label: "Langue", placeholder: "Japonais"}, {key: "role", label: "Situation", placeholder: "Commander au Ramen Bar"}],
                        templates: { standard: (v) => `Agis comme un natif en ${val(v,'langue','LANGUE')}.\nSituation : ${val(v,'role','SITUATION')}.\n\nOn fait un jeu de rôle. Tu commences. À chaque réponse de ma part :\n1. Corrige mes erreurs (grammaire/politesse).\n2. Réponds naturellement pour continuer l'histoire.\n3. Donne la traduction phonétique si besoin.` }
                    },
                    {
                        id: "strat3", title: "Lattice of Mental Models", itemIcon: "fa-cubes-stacked",
                        desc: "Prise de décision via les modèles mentaux.",
                        aiTags: ["gemini"],
                        inputs: [{key: "prob", label: "Problème", placeholder: "Dois-je démissionner ?"}],
                        templates: { standard: (v) => `Analyse mon problème : "${val(v,'prob','PROBLÈME')}" à travers 3 modèles mentaux distincts :\n1. Inversion (Comment échouer à coup sûr ?).\n2. Coût d'opportunité (Que sacrifie-je ?).\n3. Rasoir d'Hanlon ou Second Order Thinking.\n\nDonne une conclusion synthétique.` }
                    },
                    {
                        id: "strat4", title: "Arbre de Compétence RPG", itemIcon: "fa-sitemap",
                        desc: "Gamification de l'apprentissage.",
                        aiTags: ["gemini"],
                        inputs: [{key: "skill", label: "Compétence", placeholder: "Python Data Science"}],
                        templates: { standard: (v) => `Crée un 'Skill Tree' de jeu vidéo pour apprendre : ${val(v,'skill','SKILL')}.\nDivise en 4 Niveaux (Novice -> Grand Maître).\nPour chaque niveau, donne :\n- La 'Quête Principale' (Projet concret à réaliser).\n- Le 'Boss' (Concept difficile à maîtriser).\n- Le 'Loot' (Ce que je suis capable de faire une fois validé).` }
                    }
                ]
            },
            time: {
                title: "LE TEMPS",
                icon: "fa-hourglass-half",
                img: "https://images.unsplash.com/photo-1501139083538-0139583c61dd?auto=format&fit=crop&w=2000&q=80",
                isSecret: true,
                prompts: [
                    {
                        id: "time1", title: "Entropie & Flèche du Temps", itemIcon: "fa-arrow-trend-up",
                        desc: "Pourquoi le temps ne coule-t-il que dans un sens ?",
                        aiTags: ["gemini"],
                        inputs: [],
                        templates: { standard: () => `Explique le lien entre l'Entropie (Thermodynamique) et la flèche du temps.\nPourquoi ne voit-on jamais un verre brisé se reconstituer ?\nEst-ce que le temps existe au niveau microscopique (équations réversibles) ?` }
                    },
                    {
                        id: "time2", title: "Le Paradoxe de Saint Augustin", itemIcon: "fa-book-bible",
                        desc: "Qu'est-ce que le temps si personne ne me le demande ?",
                        aiTags: ["mistral"],
                        inputs: [],
                        templates: { standard: () => `Analyse les Confessions de Saint Augustin (Livre XI).\n"Qu'est-ce donc que le temps ? Si personne ne me le demande, je le sais ; mais si on me le demande et que je veuille l'expliquer, je ne le sais plus."\nFais dialoguer Augustin avec un physicien moderne sur la nature du 'Présent'.` }
                    },
                    {
                        id: "time3", title: "Chronobiologie Optimale", itemIcon: "fa-sun",
                        desc: "Hacker son rythme circadien.",
                        aiTags: ["notebook"],
                        inputs: [{key: "mode", label: "Rythme de vie", placeholder: "Travail de nuit"}],
                        templates: { standard: (v) => `Agis comme un expert en chronobiologie.\nMon rythme : ${val(v,'mode','RYTHME')}.\nCrée le protocole idéal sur 24h pour optimiser mon cortisol et ma mélatonine.\n- Heures d'exposition lumière.\n- Heures de repas.\n- Heures de sommeil et de sieste stratégique.` }
                    },
                    {
                        id: "time4", title: "Univers-Bloc (Eternalisme)", itemIcon: "fa-cube",
                        desc: "Le passé, le présent et le futur existent-ils simultanément ?",
                        aiTags: ["gemini"],
                        inputs: [],
                        templates: { standard: () => `Explique la théorie de l'Univers-Bloc (Block Universe) issue de la Relativité.\nSi tout existe déjà (passé/futur), avons-nous un libre arbitre ?\nUtilise l'analogie de la miche de pain de l'espace-temps.` }
                    }
                ]
            }
        };

        /* --- COMPOSANTS REACT --- */
        const Sidebar = ({ active, setActive, mysteryState, triggerMystery }) => {
            return (
                <div className="w-full md:w-20 lg:w-72 glass flex md:flex-col border-r border-white/10 z-50 md:h-screen fixed md:relative bottom-0">
                    <div className="p-6 hidden md:flex flex-col items-center lg:items-start relative">
                        <div className="flex items-center gap-3">
                            <h1 className="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-slate-100 to-slate-400 tracking-tight">CODEX</h1>
                            
                            {/* MYSTERY TRIGGER (SABLIER) */}
                            <button 
                                onClick={triggerMystery}
                                className={`text-slate-600 hover:text-amber-400 transition-all duration-700 ${mysteryState === 1 ? 'rotate-cw text-amber-500' : ''} ${mysteryState === 2 ? 'rotate-ccw text-amber-400 golden-glow' : ''}`}
                                title="???"
                            >
                                <i className="fa-solid fa-hourglass-start text-lg"></i>
                            </button>
                        </div>
                        
                        <div className="flex items-center gap-2 mt-1">
                            <span className="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-white/5 font-mono">v10.0</span>
                            {mysteryState === 2 && <span className="text-[10px] text-amber-500 font-mystic animate-pulse">TIME UNLOCKED</span>}
                        </div>
                    </div>
                    
                    <nav className="flex-1 flex md:flex-col gap-2 p-2 overflow-x-auto md:overflow-visible no-scrollbar">
                        {Object.entries(DATA).map(([key, cat]) => {
                            if (cat.isSecret && mysteryState < 2) return null; // Cache le module mystère
                            
                            const styles = THEME_CONFIG[key];
                            const isActive = active === key;
                            return (
                                <button key={key} onClick={() => setActive(key)}
                                    className={`p-3 rounded-xl flex items-center gap-4 transition-all duration-500 group ${isActive ? 'bg-white/5 text-white' : 'text-slate-500 hover:text-slate-200 hover:bg-white/5'} ${key === 'time' ? 'animate-fade' : ''}`}
                                >
                                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center bg-gradient-to-br ${styles.gradientIcon} shadow-lg group-hover:scale-110 transition-transform`}>
                                        <i className={`fa-solid ${cat.icon}`}></i>
                                    </div>
                                    <span className={`font-medium hidden lg:block text-sm ${key === 'time' ? 'font-mystic text-amber-400' : ''}`}>{cat.title}</span>
                                </button>
                            );
                        })}
                    </nav>
                </div>
            );
        };

        const PromptCard = ({ item, themeKey }) => {
            const [inputs, setInputs] = useState({});
            const [copied, setCopied] = useState(false);
            const [activeTab, setActiveTab] = useState('prompt');
            const styles = THEME_CONFIG[themeKey];
            const finalPrompt = useMemo(() => item.templates.standard(inputs), [inputs, item]);

            const copy = () => { navigator.clipboard.writeText(finalPrompt); setCopied(true); setTimeout(() => setCopied(false), 2000); };

            return (
                <div className="glass rounded-2xl border border-white/5 hover:border-white/20 transition-all duration-300 animate-fade flex flex-col h-full overflow-hidden">
                    <div className="p-6 border-b border-white/5 bg-white/[0.02]">
                        <div className="flex items-center gap-3 mb-2">
                            <div className={`w-10 h-10 rounded-lg flex items-center justify-center bg-slate-900 border border-white/5 text-lg ${styles.accent}`}><i className={`fa-solid ${item.itemIcon}`}></i></div>
                            <div>
                                <h3 className="text-lg font-bold text-slate-100">{item.title}</h3>
                                <div className="flex gap-2 text-[10px] text-slate-500">{item.aiTags.map(t => <span key={t}><i className={`fa-solid ${AI_TOOLS[t].icon} mr-1`}></i>{AI_TOOLS[t].label}</span>)}</div>
                            </div>
                        </div>
                        <p className="text-sm text-slate-400">{item.desc}</p>
                    </div>

                    <div className="flex border-b border-white/5">
                        <button onClick={() => setActiveTab('prompt')} className={`flex-1 py-3 text-xs font-bold uppercase ${activeTab === 'prompt' ? 'text-white bg-white/5 border-b-2 ' + styles.borderAccent : 'text-slate-500'}`}>Prompt</button>
                        {item.pedagogy && <button onClick={() => setActiveTab('pedagogy')} className={`flex-1 py-3 text-xs font-bold uppercase ${activeTab === 'pedagogy' ? 'text-white bg-white/5 border-b-2 ' + styles.borderAccent : 'text-slate-500'}`}>Pédagogie</button>}
                    </div>

                    <div className="flex-1 bg-slate-950/30 p-6">
                        {activeTab === 'prompt' ? (
                            <>
                                {item.workflow && (
                                    <div className="mb-4 bg-slate-900/50 rounded-lg p-3 border border-white/5">
                                        <div className="text-[10px] font-bold uppercase mb-2 opacity-70">Workflow</div>
                                        <ol className="text-xs text-slate-300 space-y-1">{item.workflow.map((s,i)=><li key={i}>{i+1}. {s}</li>)}</ol>
                                    </div>
                                )}
                                {item.inputs && <div className="space-y-3 mb-4">{item.inputs.map(inp => (
                                    <div key={inp.key}><label className="text-[10px] uppercase text-slate-500 font-bold ml-1">{inp.label}</label><input type="text" placeholder={inp.placeholder} onChange={(e) => setInputs({...inputs, [inp.key]: e.target.value})} className="w-full mt-1 bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-slate-500 font-mono transition-colors"/></div>
                                ))}</div>}
                                <div className="relative">
                                    <pre className="bg-slate-950 rounded-xl p-4 text-xs text-slate-400 font-mono whitespace-pre-wrap border border-white/5 max-h-64 overflow-y-auto custom-scrollbar">{finalPrompt}</pre>
                                    <button onClick={copy} className={`absolute bottom-3 right-3 px-4 py-2 rounded-lg text-xs font-bold uppercase transition-all shadow-lg flex items-center gap-2 ${copied ? 'bg-emerald-600 text-white' : styles.button}`}><i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>{copied ? 'Copié' : 'Copier'}</button>
                                </div>
                            </>
                        ) : (
                            <div className="space-y-4 animate-fade">
                                <div className="p-4 rounded-xl bg-slate-900 border border-white/5"><div className="text-[10px] text-slate-500 uppercase font-bold mb-1">Mécanisme</div><div className="text-sm text-white">{item.pedagogy.mechanism}</div></div>
                                <div className="p-4 rounded-xl bg-slate-900 border border-white/5"><div className="text-[10px] text-slate-500 uppercase font-bold mb-1">Biais Ciblé</div><div className="text-sm text-slate-300">{item.pedagogy.bias}</div></div>
                                <div className={`p-4 rounded-xl border ${styles.badge}`}><div className="text-sm leading-relaxed"><i className="fa-solid fa-lightbulb mr-2"></i>{item.pedagogy.tip}</div></div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const MainContent = ({ active }) => {
            const data = DATA[active];
            const styles = THEME_CONFIG[active];
            return (
                <div className="flex-1 h-screen overflow-y-auto relative custom-scrollbar bg-slate-950/30">
                    <div className="p-4 md:p-10 max-w-[1600px] mx-auto">
                        <div className="relative h-56 md:h-72 rounded-[2rem] overflow-hidden mb-10 border border-white/5 shadow-2xl group animate-fade">
                            <img src={data.img} className="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:scale-105 transition-transform duration-[3s]" />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/60 to-transparent"></div>
                            <div className="absolute bottom-0 left-0 p-8 md:p-12 w-full">
                                <h2 className={`text-4xl md:text-6xl font-black text-white mb-3 tracking-tighter drop-shadow-xl ${active === 'time' ? 'font-mystic text-amber-100' : ''}`}>{data.title}</h2>
                                <div className="flex items-center gap-4"><span className={`h-2 w-16 rounded-full ${styles.bgAccent}`}></span><p className={`text-sm md:text-lg font-medium ${styles.accent} uppercase tracking-widest`}>Bibliothèque Avancée</p></div>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 xl:grid-cols-2 gap-8 pb-32">
                            {data.prompts.map(p => <PromptCard key={p.id} item={p} themeKey={active} />)}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('medecine');
            const [mysteryStep, setMysteryStep] = useState(0); // 0: Locked, 1: Turned Right, 2: Unlocked

            const triggerMystery = () => {
                if (mysteryStep === 0) {
                    setMysteryStep(1); // Tourne à droite
                } else if (mysteryStep === 1) {
                    setMysteryStep(2); // Tourne à gauche + Unlock
                    setTimeout(() => setActiveTab('time'), 600); // Auto-switch après anim
                }
            };

            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden text-slate-200">
                    <Sidebar active={activeTab} setActive={setActiveTab} mysteryState={mysteryStep} triggerMystery={triggerMystery} />
                    <MainContent active={activeTab} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
