<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX GEMINI v6.0 - ULTIMA</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Configuration Avancée */
        :root {
            --bg-deep: #030712;
            --glass-panel: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #38bdf8;
            --neon-rose: #f43f5e;
            --neon-purple: #c084fc;
        }
        body {
            background-color: var(--bg-deep);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        /* Background Animé Subtil */
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* Glassmorphism */
        .glass {
            background: var(--glass-panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Scrollbar Invisible mais fonctionnelle */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        
        /* Animations */
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- BIBLIOTHÈQUE DE DONNÉES (MEGA PROMPTS) ---
        const DATA = {
            medecine: {
                title: "Médecine Interne & Immuno",
                theme: "blue",
                icon: "fa-user-doctor",
                img: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?q=80&w=2070&auto=format&fit=crop",
                prompts: [
                    {
                        id: "m1",
                        title: "Le Staff Universitaire (Zotero)",
                        desc: "Analyse croisée de littérature médicale de haut niveau.",
                        inputs: [
                            {key: "sujet", label: "Sujet Pathologique", placeholder: "ex: Lupus Systémique"},
                            {key: "nb_sources", label: "Nombre d'articles", placeholder: "ex: 5"}
                        ],
                        template: (v) => `Agis comme un Professeur de Médecine Interne en milieu hospitalo-universitaire. J'ai chargé ${v.nb_sources || 'plusieurs'} articles récents concernant ${v.sujet || 'une pathologie'} dans NotebookLM.\n\nTACHE :\nRéalise une synthèse structurée de ces documents en te focalisant sur :\n1. Les nouvelles cibles thérapeutiques (mécanisme moléculaire précis).\n2. Les points de divergence entre les auteurs (controverses).\n3. La validité méthodologique : identifie les biais potentiels dans les cohortes citées.\n\nFORMAT DE SORTIE :\n- Tableau comparatif des études.\n- Conclusion pratique : "Ce qui change pour le clinicien en 2024".\n- Niveau de preuve (Grades HAS).`
                    },
                    {
                        id: "m2",
                        title: "Le Physiopathologiste Moléculaire",
                        desc: "Visualisation mentale des mécanismes complexes.",
                        inputs: [
                            {key: "patho", label: "Maladie / Mécanisme", placeholder: "ex: Syndrome d'Activation Macrophagique"}
                        ],
                        template: (v) => `Explique la physiopathologie détaillée de : ${v.patho || 'la maladie'} au niveau cellulaire et moléculaire.\n\nCONSIGNES :\n1. Décris la cascade inflammatoire étape par étape (Signalisation -> Transcription -> Cytokines).\n2. Utilise des analogies visuelles fortes pour expliquer les interactions récepteurs-ligands.\n3. Fais le lien direct entre chaque étape moléculaire et le signe clinique observable au lit du patient.\n4. Liste les biothérapies (Anti-IL1, Anti-IL6, JAKi, etc.) qui ciblent spécifiquement ces étapes.`
                    },
                    {
                        id: "m3",
                        title: "L'Avocat du Diable (Diagnostic)",
                        desc: "Lutte contre le biais de confirmation.",
                        inputs: [
                            {key: "diag", label: "Diagnostic suspecté", placeholder: "ex: Maladie de Horton"},
                            {key: "signes", label: "Signes présents", placeholder: "ex: Céphalées, VS élevée"}
                        ],
                        template: (v) => `Je suspecte un diagnostic de ${v.diag || '...'} devant ce tableau : ${v.signes || '...'}.\n\nTON RÔLE : Tu es un "Red Team" médical. Ton but est de prouver que j'ai tort pour éviter l'erreur diagnostique.\n\nACTION :\n1. Liste 3 diagnostics différentiels (Mimics) qui pourraient parfaitement expliquer ce tableau mais qui sont plus graves ou nécessitent un traitement opposé.\n2. Pour chaque diagnostic alternatif, donne le "Key Feature" manquant que je dois aller chercher immédiatement.\n3. Calcule (estimation) la probabilité pré-test de mon diagnostic vs les autres.`
                    }
                ]
            },
            gourmand: {
                title: "Dr GOURMAND (Le Jeu)",
                theme: "rose",
                icon: "fa-skull-crossbones",
                img: "https://images.unsplash.com/photo-1516574187841-69301976e499?q=80&w=2070&auto=format&fit=crop",
                prompts: [
                    {
                        id: "g1",
                        title: "MOTEUR DE JEU v2 (Start)",
                        desc: "Lancement de la simulation hardcore.",
                        inputs: [
                            {key: "specialite", label: "Domaine", placeholder: "Médecine Interne / Infectieux"},
                            {key: "difficulte", label: "Difficulté (1-10)", placeholder: "9"}
                        ],
                        template: (v) => `Tu es le Moteur de Simulation Clinique "Dr GOURMAND".\n\nPARAMÈTRES :\n- Spécialité : ${v.specialite || 'Médecine Interne'}\n- Difficulté : ${v.difficulte || 'Expert'}\n\nRÈGLES ABSOLUES (System Prompt) :\n1. Choisis SECRÈTEMENT un patient et un diagnostic complexe. NE LE RÉVÈLE JAMAIS.\n2. Le jeu est au tour par tour. J'agis (examen, question, bio), tu réponds par le résultat brut.\n3. GESTION DU TEMPS : Chaque action coûte du temps virtuel. Si je suis lent ou imprécis, l'état hémodynamique du patient se dégrade.\n4. FIN : Victoire si je trouve le diagnostic et le traitement. Défaite si le patient décède.\n\nCommence maintenant par l'arrivée du patient aux urgences (constantes, motif). C'est à moi.`
                    },
                    {
                        id: "g2",
                        title: "Action : Le Coup de Poker",
                        desc: "Tenter un traitement sans preuve formelle.",
                        inputs: [
                            {key: "tt", label: "Traitement testé", placeholder: "ex: Bolus Solumedrol 1g"}
                        ],
                        template: (v) => `(ACTION EN JEU) : Je prends un risque calculé. Je décide d'administrer : ${v.tt || 'un traitement'}.\n\nSimule les effets sur les 6 prochaines heures :\n- Si c'était le bon diagnostic : amélioration spectaculaire.\n- Si c'était infectieux/septique : aggravation brutale (choc).\n- Décris uniquement la surveillance infirmière et les constantes.`
                    }
                ]
            },
            culture: {
                title: "Culture & Savoir Absolu",
                theme: "purple",
                icon: "fa-book-open-reader",
                img: "https://images.unsplash.com/photo-1461360370896-922624d12aa1?q=80&w=2074&auto=format&fit=crop",
                prompts: [
                    {
                        id: "c1",
                        title: "Le Dîner des Esprits",
                        desc: "Simulation de débat philosophique.",
                        inputs: [
                            {key: "invites", label: "Invités", placeholder: "Camus, Nietzsche, Spinoza"},
                            {key: "theme", label: "Sujet du débat", placeholder: "L'intelligence artificielle a-t-elle une âme ?"}
                        ],
                        template: (v) => `Organise une conversation (sous forme de script théâtral) entre ces personnages : ${v.invites || 'des philosophes'}.\n\nSUJET : ${v.theme || 'La vie'}.\n\nCONSIGNES :\n- Respecte scrupuleusement le style de chaque auteur (le vocabulaire, les concepts clés).\n- Ils doivent interagir, se couper la parole, être en désaccord.\n- Inclus des didascalies sur leurs expressions corporelles.\n- Termine par une synthèse qu'aurait pu écrire Hermann Hesse.`
                    },
                    {
                        id: "c2",
                        title: "Trivial Pursuit Adaptatif",
                        desc: "Quiz infini qui apprend de votre niveau.",
                        inputs: [
                            {key: "themes", label: "Thèmes", placeholder: "Histoire, Géo, Art, Sciences"}
                        ],
                        template: (v) => `Génère un Quiz de 5 questions sur : ${v.themes || 'Culture G'}.\n\nMÉCANIQUE :\n- Commence niveau Difficile.\n- Pose une seule question à la fois.\n- Attends ma réponse.\n- Si je réponds juste : la prochaine question doit être plus dure et plus pointue.\n- Si je réponds faux : explique la réponse avec une anecdote mémorable, puis baisse légèrement la difficulté.\n- Affiche mon score ELO virtuel.`
                    }
                ]
            },
            code: {
                title: "Code, Création & Tech",
                theme: "orange",
                icon: "fa-code",
                img: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=2070&auto=format&fit=crop",
                prompts: [
                    {
                        id: "dev1",
                        title: "L'Architecte Web (One-File)",
                        desc: "Crée des mini-apps complètes.",
                        inputs: [
                            {key: "app", label: "Idée d'application", placeholder: "Calculateur de clairance rénale design"}
                        ],
                        template: (v) => `Agis comme un développeur Fullstack Senior expert en React et Tailwind CSS.\n\nPROJET : Je veux créer une application web "Single File" (un seul fichier HTML) pour : ${v.app || 'un outil'}.\n\nEXIGENCES :\n1. Utilise React et Babel via CDN (comme dans l'exemple du Codex).\n2. Design : Sombre, moderne, "Medical Grade", responsive.\n3. Code robuste : gestion des erreurs (inputs vides).\n4. Fournis le code complet prêt à être copié-collé sans aucune explication préliminaire.`
                    },
                    {
                        id: "chess",
                        title: "Le Grand Maître (Vision)",
                        desc: "Analyse de position d'échecs.",
                        inputs: [],
                        template: (v) => `(Action : Upload une capture d'écran de l'échiquier)\n\nAnalyse cette position comme un Grand Maître.\n1. Évaluation : Qui est mieux ? (+/-)\n2. Candidats : Quels sont les 3 coups candidats pour le trait ?\n3. Plan : Quel est le plan stratégique à long terme (structure de pions, cases faibles) ?\n4. Menace : Y a-t-il une tactique immédiate ?`
                    }
                ]
            }
        };

        // --- COMPOSANTS ---

        const Sidebar = ({ active, setActive }) => (
            <div className="w-full md:w-20 lg:w-72 glass flex md:flex-col border-r border-white/10 z-50 md:h-screen fixed md:relative bottom-0">
                <div className="p-6 hidden md:flex flex-col items-center lg:items-start">
                    <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400 hidden lg:block">CODEX</h1>
                    <span className="text-[10px] text-slate-400 tracking-widest font-mono mt-1 hidden lg:block">ULTIMA v6.0</span>
                    <i className="fa-solid fa-cube text-3xl text-blue-500 lg:hidden"></i>
                </div>
                
                <nav className="flex-1 flex md:flex-col justify-around md:justify-start gap-2 p-2 overflow-x-auto md:overflow-visible">
                    {Object.entries(DATA).map(([key, cat]) => (
                        <button
                            key={key}
                            onClick={() => setActive(key)}
                            className={`p-3 rounded-xl flex items-center gap-4 transition-all duration-300 group
                            ${active === key ? 'bg-white/10 text-white shadow-lg border border-white/10' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                        >
                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center bg-gradient-to-br from-${cat.theme}-500/20 to-${cat.theme}-600/20 text-${cat.theme}-400 group-hover:scale-110 transition-transform`}>
                                <i className={`fa-solid ${cat.icon}`}></i>
                            </div>
                            <span className="font-medium hidden lg:block">{cat.title}</span>
                        </button>
                    ))}
                </nav>
            </div>
        );

        const PromptCard = ({ item, theme }) => {
            const [inputs, setInputs] = useState({});
            const [copied, setCopied] = useState(false);

            const handleInput = (key, value) => {
                setInputs(prev => ({...prev, [key]: value}));
            };

            const finalPrompt = useMemo(() => item.template(inputs), [inputs]);

            const copy = () => {
                navigator.clipboard.writeText(finalPrompt);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="glass rounded-2xl p-6 hover:border-white/20 transition-all duration-300 group animate-slide">
                    <div className="flex justify-between items-start mb-4">
                        <div>
                            <h3 className="text-xl font-bold text-white group-hover:text-blue-300 transition-colors">{item.title}</h3>
                            <p className="text-sm text-slate-400 mt-1">{item.desc}</p>
                        </div>
                        <span className={`text-${theme}-400 text-xs font-mono border border-${theme}-400/30 px-2 py-1 rounded bg-${theme}-400/10`}>PROMPT</span>
                    </div>

                    {/* Zone de saisie dynamique (Variables) */}
                    {item.inputs && item.inputs.length > 0 && (
                        <div className="bg-black/40 rounded-lg p-3 mb-4 border border-white/5">
                            <div className="text-[10px] uppercase text-slate-500 font-bold mb-2 tracking-wider">Variables</div>
                            <div className="grid gap-3">
                                {item.inputs.map((inp) => (
                                    <div key={inp.key} className="flex flex-col">
                                        <label className="text-xs text-slate-300 mb-1">{inp.label}</label>
                                        <input 
                                            type="text" 
                                            placeholder={inp.placeholder}
                                            onChange={(e) => handleInput(inp.key, e.target.value)}
                                            className="bg-slate-900/80 border border-white/10 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors"
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Preview du Prompt */}
                    <div className="relative mt-4">
                        <div className="absolute -top-3 left-3 bg-slate-800 text-[10px] text-slate-400 px-2 rounded border border-white/10">PREVIEW</div>
                        <pre className="bg-slate-950/60 rounded-xl p-4 pt-6 text-xs text-slate-300 font-mono whitespace-pre-wrap border border-white/5 max-h-48 overflow-y-auto custom-scrollbar">
                            {finalPrompt}
                        </pre>
                        <button 
                            onClick={copy}
                            className={`absolute bottom-3 right-3 px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all shadow-lg flex items-center gap-2
                            ${copied ? 'bg-green-500 text-white' : `bg-slate-800 hover:bg-${theme}-500 text-white border border-white/10`}`}
                        >
                            <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                            {copied ? 'Copié !' : 'Copier'}
                        </button>
                    </div>
                </div>
            );
        };

        const MainContent = ({ active }) => {
            const data = DATA[active];
            
            return (
                <div className="flex-1 h-screen overflow-y-auto p-4 md:p-8 relative">
                    {/* Header Image Dynamique */}
                    <div className="relative h-64 rounded-3xl overflow-hidden mb-10 border border-white/10 shadow-2xl group">
                        <img src={data.img} className="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:scale-105 transition-transform duration-1000" />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/60 to-transparent"></div>
                        <div className="absolute bottom-0 left-0 p-8">
                            <h2 className="text-5xl font-black text-white mb-2 tracking-tight drop-shadow-lg">{data.title}</h2>
                            <div className="flex items-center gap-3">
                                <span className={`h-1 w-12 bg-${data.theme}-500 rounded-full`}></span>
                                <p className="text-slate-200 text-lg font-light">Bibliothèque de Prompts Intelligents</p>
                            </div>
                        </div>
                    </div>

                    {/* Grille de Prompts */}
                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-8 pb-32">
                        {data.prompts.map(p => (
                            <PromptCard key={p.id} item={p} theme={data.theme} />
                        ))}
                    </div>

                    {/* Footer */}
                    <div className="text-center text-slate-600 text-xs py-10 font-mono">
                        Propulsé par Gemini 1.5 Pro • Édition Personnelle Dr Gourmand
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('medecine');

            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden text-slate-200">
                    <Sidebar active={activeTab} setActive={setActiveTab} />
                    <MainContent active={activeTab} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
